<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1b4b" />
    <title>Godware Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fa;
        color: #0f172a;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid #dbe3ef;
        border-radius: 16px;
        background: white;
        padding: 28px;
        box-shadow: 0 20px 45px -30px rgba(15, 23, 42, 0.45);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #5b6b84;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to continue using Godware. Saved accounting data is kept online so it stays accurate across devices.</p>
    </main>
  </body>
</html>
